name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package universal macOS archives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.21.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone executables
        run: |
          mkdir -p staging/frontend/bin staging/backend/libexec release

          bun build packages/frontend/src/ui/app.ts --compile --target=bun-darwin-arm64 --outfile=staging/frontend/bin/agent-console-darwin-arm64
          bun build packages/frontend/src/ui/app.ts --compile --target=bun-darwin-x64 --outfile=staging/frontend/bin/agent-console-darwin-x86_64
          bun build packages/backend/src/backend.ts --compile --target=bun-darwin-arm64 --outfile=staging/backend/libexec/agent-console-backend-darwin-arm64
          bun build packages/backend/src/backend.ts --compile --target=bun-darwin-x64 --outfile=staging/backend/libexec/agent-console-backend-darwin-x86_64
          bun build packages/backend/src/tmux-hook.ts --compile --target=bun-darwin-arm64 --outfile=staging/backend/libexec/agent-console-backend-tmux-hook-darwin-arm64
          bun build packages/backend/src/tmux-hook.ts --compile --target=bun-darwin-x64 --outfile=staging/backend/libexec/agent-console-backend-tmux-hook-darwin-x86_64

      - name: Package universal release archives
        run: |
          tar -C staging/frontend -czf release/agent-console-darwin-universal.tar.gz bin
          tar -C staging/backend -czf release/agent-console-backend-darwin-universal.tar.gz libexec
          shasum -a 256 release/agent-console-darwin-universal.tar.gz > release/agent-console.sha256
          shasum -a 256 release/agent-console-backend-darwin-universal.tar.gz > release/agent-console-backend.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Verify release archives
        run: |
          set -euo pipefail
          shasum -a 256 -c release/agent-console.sha256
          shasum -a 256 -c release/agent-console-backend.sha256

          mkdir frontend backend
          tar -C frontend -xzf release/agent-console-darwin-universal.tar.gz
          tar -C backend -xzf release/agent-console-backend-darwin-universal.tar.gz

          test -x frontend/bin/agent-console-darwin-arm64
          test -x frontend/bin/agent-console-darwin-x86_64
          test -x backend/libexec/agent-console-backend-darwin-arm64
          test -x backend/libexec/agent-console-backend-darwin-x86_64
          test -x backend/libexec/agent-console-backend-tmux-hook-darwin-arm64
          test -x backend/libexec/agent-console-backend-tmux-hook-darwin-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.sha256
