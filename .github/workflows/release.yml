name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package universal macOS archives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.21.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone executables
        run: |
          mkdir -p staging/frontend/bin staging/backend/libexec release

          bun build packages/frontend/src/ui/app.ts --compile --target=bun-darwin-arm64 --outfile=staging/frontend/bin/agent-console-darwin-arm64
          bun build packages/frontend/src/ui/app.ts --compile --target=bun-darwin-x64 --outfile=staging/frontend/bin/agent-console-darwin-x86_64
          bun build packages/backend/src/backend.ts --compile --target=bun-darwin-arm64 --outfile=staging/backend/libexec/agent-console-backend-darwin-arm64
          bun build packages/backend/src/backend.ts --compile --target=bun-darwin-x64 --outfile=staging/backend/libexec/agent-console-backend-darwin-x86_64
          bun build packages/backend/src/tmux-hook.ts --compile --target=bun-darwin-arm64 --outfile=staging/backend/libexec/agent-console-backend-tmux-hook-darwin-arm64
          bun build packages/backend/src/tmux-hook.ts --compile --target=bun-darwin-x64 --outfile=staging/backend/libexec/agent-console-backend-tmux-hook-darwin-x86_64

      - name: Package universal release archives
        run: |
          tar -C staging/frontend -czf release/agent-console-darwin-universal.tar.gz bin
          tar -C staging/backend -czf release/agent-console-backend-darwin-universal.tar.gz libexec
          shasum -a 256 release/agent-console-darwin-universal.tar.gz > release/agent-console.sha256
          shasum -a 256 release/agent-console-backend-darwin-universal.tar.gz > release/agent-console-backend.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Verify release archives
        run: |
          set -euo pipefail
          shasum -a 256 -c release/agent-console.sha256
          shasum -a 256 -c release/agent-console-backend.sha256

          mkdir frontend backend
          tar -C frontend -xzf release/agent-console-darwin-universal.tar.gz
          tar -C backend -xzf release/agent-console-backend-darwin-universal.tar.gz

          test -x frontend/bin/agent-console-darwin-arm64
          test -x frontend/bin/agent-console-darwin-x86_64
          test -x backend/libexec/agent-console-backend-darwin-arm64
          test -x backend/libexec/agent-console-backend-darwin-x86_64
          test -x backend/libexec/agent-console-backend-tmux-hook-darwin-arm64
          test -x backend/libexec/agent-console-backend-tmux-hook-darwin-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.sha256

      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo 'HOMEBREW_TAP_TOKEN is required to update the Homebrew formulas.' >&2
            exit 1
          }

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: schinwald/homebrew-agent-console
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formulas
        env:
          TAG: ${{ github.ref_name }}
        run: |
          FRONTEND_SHA256="$(shasum -a 256 release/agent-console-darwin-universal.tar.gz | awk '{print $1}')"
          BACKEND_SHA256="$(shasum -a 256 release/agent-console-backend-darwin-universal.tar.gz | awk '{print $1}')"
          export FRONTEND_SHA256 BACKEND_SHA256
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['TAG']
          formulas = (
              ('Formula/agent-console.rb', 'agent-console-darwin-universal.tar.gz', os.environ['FRONTEND_SHA256']),
              ('Formula/agent-console-backend.rb', 'agent-console-backend-darwin-universal.tar.gz', os.environ['BACKEND_SHA256']),
          )

          for relative_path, archive, sha256 in formulas:
              formula = Path('homebrew-tap') / relative_path
              contents = formula.read_text()
              contents, url_replacements = re.subn(
                  rf'(releases/download/)v[^/]+(/{re.escape(archive)})',
                  rf'\g<1>{tag}\g<2>',
                  contents,
              )
              contents, checksum_replacements = re.subn(
                  r'(?m)^  sha256 "[0-9a-f]+"$',
                  f'  sha256 "{sha256}"',
                  contents,
              )
              if url_replacements != 1 or checksum_replacements != 1:
                  raise SystemExit(
                      f'{relative_path}: expected exactly one release URL and SHA-256 replacement; '
                      f'found {url_replacements} URL and {checksum_replacements} SHA-256 matches.'
                  )
              formula.write_text(contents)
          PY
          git -C homebrew-tap diff --check
          git -C homebrew-tap diff --quiet && exit 0
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Formula/agent-console.rb Formula/agent-console-backend.rb
          git -C homebrew-tap commit -m "release: update Agent Console to ${TAG}"
          git -C homebrew-tap push
